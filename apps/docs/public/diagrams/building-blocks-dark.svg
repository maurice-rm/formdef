  <title id="building-blocks-dark-title">The building blocks of a formdef form</title>
  <desc id="building-blocks-dark-desc">The schema, the config and the registry go into createForm, which checks the config and returns a component. That component creates a TanStack form with useAppForm and renders Fields, which hands each widget its field as a prop; the widget writes values back through handleChange.</desc>
