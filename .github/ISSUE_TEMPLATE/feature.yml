name: Feature
description: Something formdef should do that it does not do today.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to build, and where formdef stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work, for example the config you would like to write.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: The workaround you use now, if there is one.
